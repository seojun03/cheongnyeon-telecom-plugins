name: Cross-platform validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  plugin-tests:
    name: Plugin tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate distribution
        run: python scripts/validate_distribution.py
      - name: Run all skill tests
        working-directory: plugins/cheongnyeon-telecom-blog/skills/cheongnyeon-telecom-blog
        run: python -m unittest discover -s tests -p "test_*.py" -v

  install-macos:
    name: Public Git install (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Codex CLI
        run: npm install --global @openai/codex
      - name: Run macOS installer against this commit
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CHEONGNYEON_AUTO_UPDATE_ROOT: ${{ runner.temp }}/auto-updater
          CHEONGNYEON_LAUNCH_AGENTS_DIR: ${{ runner.temp }}/launch-agents
          CHEONGNYEON_SKIP_SCHEDULER_ACTIVATION: "1"
          CHEONGNYEON_SKIP_APP_INSTALL: "1"
          CHEONGNYEON_NO_LAUNCH: "1"
          CHEONGNYEON_REPOSITORY_REF: ${{ github.sha }}
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/seojun03/cheongnyeon-telecom-plugins/${{ github.sha }}/install-macos.sh)"
      - name: Verify scheduler and old-to-new auto update
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          test -x "${{ runner.temp }}/auto-updater/run-update.sh"
          plutil -lint "${{ runner.temp }}/launch-agents/com.cheongnyeon.telecom.plugin-updater.plist"
          codex plugin list --json | python -c 'import json,sys; d=json.load(sys.stdin); p=next((x for x in d["installed"] if x["pluginId"]=="cheongnyeon-telecom-blog@cheongnyeon-telecom"),None); assert p and p["enabled"]'
          codex plugin remove cheongnyeon-telecom-blog@cheongnyeon-telecom --json >/dev/null
          codex plugin marketplace remove cheongnyeon-telecom --json >/dev/null
          codex plugin marketplace add seojun03/cheongnyeon-telecom-plugins --ref v0.1.0 --json >/dev/null
          codex plugin add cheongnyeon-telecom-blog@cheongnyeon-telecom --json >/dev/null
          codex plugin list --json | python -c 'import json,sys; d=json.load(sys.stdin); p=next(x for x in d["installed"] if x["pluginId"]=="cheongnyeon-telecom-blog@cheongnyeon-telecom"); assert p["version"]=="0.1.0+codex.20260810141037", p'
          env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" /bin/bash "${{ runner.temp }}/auto-updater/run-update.sh"
          codex plugin list --json | python -c 'import json,sys,pathlib; d=json.load(sys.stdin); p=next(x for x in d["installed"] if x["pluginId"]=="cheongnyeon-telecom-blog@cheongnyeon-telecom"); expected=json.loads(pathlib.Path("plugins/cheongnyeon-telecom-blog/.codex-plugin/plugin.json").read_text())["version"]; assert p["enabled"] and p["version"]==expected, (p,expected)'
      - name: Install editable copy and verify local edits
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CHEONGNYEON_EDITABLE_ROOT: ${{ runner.temp }}/editable-plugin
          CHEONGNYEON_LAUNCH_AGENTS_DIR: ${{ runner.temp }}/launch-agents
          CHEONGNYEON_SKIP_APP_INSTALL: "1"
          CHEONGNYEON_NO_LAUNCH: "1"
          CHEONGNYEON_SKIP_DESKTOP_SHORTCUT: "1"
          CHEONGNYEON_REPOSITORY_REF: ${{ github.sha }}
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/seojun03/cheongnyeon-telecom-plugins/${{ github.sha }}/install-editable-macos.sh)"
          test ! -f "${{ runner.temp }}/launch-agents/com.cheongnyeon.telecom.plugin-updater.plist"
          codex plugin list --json | python -c 'import json,sys; d=json.load(sys.stdin); p=next(x for x in d["installed"] if x["pluginId"]=="cheongnyeon-telecom-blog@cheongnyeon-telecom"); assert p["enabled"] and p["marketplaceSource"]["sourceType"]=="local", p'
          printf '\nEDITABLE_LOCAL_TEST_MARKER\n' >> "${{ runner.temp }}/editable-plugin/plugins/cheongnyeon-telecom-blog/skills/cheongnyeon-telecom-blog/SKILL.md"
          /bin/bash "${{ runner.temp }}/editable-plugin/scripts/apply-local-edits-macos.sh"
          codex plugin list --json | python -c 'import json,sys,pathlib; d=json.load(sys.stdin); p=next(x for x in d["installed"] if x["pluginId"]=="cheongnyeon-telecom-blog@cheongnyeon-telecom"); assert p["enabled"] and "+codex.local." in p["version"] and p["marketplaceSource"]["sourceType"]=="local", p; f=pathlib.Path("${{ runner.temp }}/codex-home/plugins/cache/cheongnyeon-telecom/cheongnyeon-telecom-blog")/p["version"]/"skills/cheongnyeon-telecom-blog/SKILL.md"; assert "EDITABLE_LOCAL_TEST_MARKER" in f.read_text(), f'

  install-windows:
    name: Public Git install (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unavailable Python alias does not abort installer detection
        shell: powershell
        run: |
          $installer = Get-Content -LiteralPath "install-windows.ps1" -Raw -Encoding UTF8
          $functionMatch = [regex]::Match(
              $installer,
              '(?ms)^function Test-PythonAvailable \{.*?^\}'
          )
          if (-not $functionMatch.Success) { throw "Test-PythonAvailable was not found" }
          Invoke-Expression $functionMatch.Value

          $fakeRoot = Join-Path $env:RUNNER_TEMP "fake-python-alias"
          New-Item -ItemType Directory -Path $fakeRoot -Force | Out-Null
          $source = @'
          using System;
          public static class Program {
              public static int Main() {
                  Console.Error.WriteLine("Python");
                  return 1;
              }
          }
          '@
          Add-Type -TypeDefinition $source -OutputAssembly (Join-Path $fakeRoot "python.exe") -OutputType ConsoleApplication
          $previousPath = $env:Path
          try {
              $env:Path = $fakeRoot
              $ErrorActionPreference = "Stop"
              $pythonAvailable = Test-PythonAvailable
              $global:LASTEXITCODE = 0
              if ($pythonAvailable) { throw "Broken Python alias was reported as available" }
          } finally {
              $env:Path = $previousPath
          }
      - name: Verify already-current winget result is successful
        shell: powershell
        run: |
          $installer = Get-Content -LiteralPath "install-windows.ps1" -Raw -Encoding UTF8
          foreach ($functionName in @("Write-Step", "Refresh-ProcessPath", "Test-WingetPackageInstalled", "Install-WingetPackage")) {
              $escapedName = [regex]::Escape($functionName)
              $functionMatch = [regex]::Match(
                  $installer,
                  "(?ms)^function $escapedName(?:\([^)]*\))? \{.*?^\}"
              )
              if (-not $functionMatch.Success) { throw "$functionName was not found" }
              Invoke-Expression $functionMatch.Value
          }

          $fakeRoot = Join-Path $env:RUNNER_TEMP "fake-winget"
          New-Item -ItemType Directory -Path $fakeRoot -Force | Out-Null
          $source = @'
          using System;
          public static class Program {
              public static int Main() {
                  string value = Environment.GetEnvironmentVariable("CHEONGNYEON_FAKE_WINGET_EXIT_CODE");
                  return String.IsNullOrEmpty(value) ? 0 : Int32.Parse(value);
              }
          }
          '@
          Add-Type -TypeDefinition $source -OutputAssembly (Join-Path $fakeRoot "winget.exe") -OutputType ConsoleApplication
          $previousPath = $env:Path
          try {
              $env:Path = "$fakeRoot;$previousPath"
              $env:CHEONGNYEON_FAKE_WINGET_EXIT_CODE = "0"
              if (-not (Test-WingetPackageInstalled -Id "9PLM9XGG6VKS" -Source "msstore")) {
                  throw "Installed package was not detected"
              }

              foreach ($exitCode in @("-1978335189", "-1978335153", "-1978335135")) {
                  $env:Path = "$fakeRoot;$previousPath"
                  $env:CHEONGNYEON_FAKE_WINGET_EXIT_CODE = $exitCode
                  Install-WingetPackage -Id "9PLM9XGG6VKS" -Source "msstore"
              }
              $global:LASTEXITCODE = 0
          } finally {
              $env:Path = $previousPath
              Remove-Item Env:CHEONGNYEON_FAKE_WINGET_EXIT_CODE -ErrorAction SilentlyContinue
          }
      - name: Reject inaccessible Codex and fall back to a usable command
        shell: powershell
        run: |
          $installer = Get-Content -LiteralPath "install-windows.ps1" -Raw -Encoding UTF8
          foreach ($functionName in @("Test-CodexExecutable", "Get-NpmCommand", "Get-CodexCommand", "Invoke-Codex")) {
              $escapedName = [regex]::Escape($functionName)
              $functionMatch = [regex]::Match(
                  $installer,
                  "(?ms)^function $escapedName(?:\([^)]*\))? \{.*?^\}"
              )
              if (-not $functionMatch.Success) { throw "$functionName was not found" }
              Invoke-Expression $functionMatch.Value
          }

          $fakeRoot = Join-Path $env:RUNNER_TEMP "fake-codex-candidates"
          New-Item -ItemType Directory -Path $fakeRoot -Force | Out-Null
          $blocked = Join-Path $fakeRoot "blocked-codex.exe"
          Set-Content -LiteralPath $blocked -Value "not a Windows executable" -Encoding ASCII
          $versionOnly = Join-Path $fakeRoot "version-only.cmd"
          Set-Content -LiteralPath $versionOnly -Value '@if "%1"=="--version" (exit /b 0) else (exit /b 1)' -Encoding ASCII
          $usable = Join-Path $fakeRoot "codex.cmd"
          Set-Content -LiteralPath $usable -Value '@if "%1"=="plugin" if "%2"=="--help" (exit /b 0) else (exit /b 1)' -Encoding ASCII
          $warningOnly = Join-Path $fakeRoot "warning-codex.cmd"
          Set-Content -LiteralPath $warningOnly -Value '@echo harmless warning 1>&2 & exit /b 0' -Encoding ASCII

          if (Test-CodexExecutable -Candidate $blocked) { throw "An unlaunchable executable was accepted" }
          if (Test-CodexExecutable -Candidate $versionOnly) { throw "A CLI without plugin support was accepted" }
          if (-not (Test-CodexExecutable -Candidate $warningOnly)) { throw "A successful CLI warning on stderr was treated as failure" }

          $warningJson = Join-Path $fakeRoot "warning-json-codex.exe"
          $warningJsonSource = @'
          using System;
          public static class WarningJsonCodex {
              public static int Main(string[] args) {
                  Console.Error.WriteLine("harmless warning");
                  Console.WriteLine("{\"installed\":[]}");
                  return 0;
              }
          }
          '@
          Add-Type -TypeDefinition $warningJsonSource -OutputAssembly $warningJson -OutputType ConsoleApplication
          $script:CodexExecutable = $warningJson
          $warningResult = (Invoke-Codex -Arguments @("plugin", "list", "--json") -Capture) | ConvertFrom-Json
          if ($null -eq $warningResult.installed) { throw "Codex stdout JSON was lost when stderr contained a warning" }

          $accessDenied = Join-Path $fakeRoot "access-denied-codex.exe"
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot "System32\whoami.exe") -Destination $accessDenied
          $originalAcl = Get-Acl -LiteralPath $accessDenied
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $denyRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $identity,
              [System.Security.AccessControl.FileSystemRights]::ExecuteFile,
              [System.Security.AccessControl.AccessControlType]::Deny
          )
          $blockedAcl = Get-Acl -LiteralPath $accessDenied
          $blockedAcl.AddAccessRule($denyRule)
          Set-Acl -LiteralPath $accessDenied -AclObject $blockedAcl
          try {
              if (Test-CodexExecutable -Candidate $accessDenied) { throw "An access-denied executable was accepted" }
          } finally {
              Set-Acl -LiteralPath $accessDenied -AclObject $originalAcl
          }

          $previousPath = $env:Path
          $previousExplicit = $env:CHEONGNYEON_CODEX_PATH
          $previousLocalAppData = $env:LOCALAPPDATA
          $previousAppData = $env:APPDATA
          try {
              $CodexPath = $blocked
              $env:CHEONGNYEON_CODEX_PATH = $blocked
              $env:LOCALAPPDATA = Join-Path $fakeRoot "local-app-data"
              $env:APPDATA = Join-Path $fakeRoot "roaming-app-data"
              $env:Path = "$fakeRoot;$previousPath"
              $resolved = Get-CodexCommand
              if ($resolved -ne $usable) { throw "Did not recover from an invalid explicit Codex path: $resolved" }
          } finally {
              $env:Path = $previousPath
              $env:LOCALAPPDATA = $previousLocalAppData
              $env:APPDATA = $previousAppData
              if ($null -eq $previousExplicit) {
                  Remove-Item Env:CHEONGNYEON_CODEX_PATH -ErrorAction SilentlyContinue
              } else {
                  $env:CHEONGNYEON_CODEX_PATH = $previousExplicit
              }
          }
      - name: Run Windows PowerShell 5.1 installer against this commit
        shell: powershell
        env:
          CODEX_HOME: ${{ runner.temp }}\codex-home
          CODEX_INSTALL_DIR: ${{ runner.temp }}\codex-bin
          CHEONGNYEON_AUTO_UPDATE_ROOT: ${{ runner.temp }}\auto-updater
          CHEONGNYEON_AUTO_UPDATE_TASK_NAME: CheongnyeonTelecomPluginUpdate-CI
          CHEONGNYEON_SKIP_APP_INSTALL: "1"
          CHEONGNYEON_NO_LAUNCH: "1"
          CHEONGNYEON_REPOSITORY_REF: ${{ github.sha }}
        run: |
          $blocked = Join-Path $env:RUNNER_TEMP "blocked-appx-codex.exe"
          Set-Content -LiteralPath $blocked -Value "simulated unlaunchable Appx executable" -Encoding ASCII
          $env:CHEONGNYEON_CODEX_PATH = $blocked
          irm "https://raw.githubusercontent.com/seojun03/cheongnyeon-telecom-plugins/${{ github.sha }}/install-windows.ps1" | iex
          $standalone = Join-Path $env:CODEX_INSTALL_DIR "codex.exe"
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) { throw "Official standalone Codex was not installed" }
          & $standalone plugin --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Official standalone Codex does not support plugins" }
          if ($env:CHEONGNYEON_CODEX_PATH -ne $standalone) { throw "Installer did not export the verified standalone Codex path" }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, (Split-Path -Parent $standalone) + [Environment]::NewLine, $utf8)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CODEX_BIN=$standalone" + [Environment]::NewLine, $utf8)
      - name: Install from an extracted GitHub ZIP
        shell: powershell
        env:
          CODEX_HOME: ${{ runner.temp }}\zip-codex-home
          CODEX_INSTALL_DIR: ${{ runner.temp }}\zip-codex-bin
          CHEONGNYEON_EDITABLE_ROOT: ${{ runner.temp }}\zip-editable-plugin
          CHEONGNYEON_SKIP_DESKTOP_SHORTCUT: "1"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cheongnyeon-source.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "cheongnyeon-source"
          git archive --format=zip --prefix=cheongnyeon-telecom-plugins-main/ --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to create source ZIP" }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          $source = Join-Path $expanded "cheongnyeon-telecom-plugins-main"
          $mainCodexDirectory = (Split-Path -Parent $env:CODEX_BIN).TrimEnd("\")
          $env:Path = (($env:Path -split ";") | Where-Object { $_ -and $_.TrimEnd("\") -ne $mainCodexDirectory }) -join ";"
          Remove-Item Env:CHEONGNYEON_CODEX_PATH -ErrorAction SilentlyContinue
          & (Join-Path $source "install-from-download-windows.ps1")
          $zipCodex = Join-Path $env:CODEX_INSTALL_DIR "codex.exe"
          if (-not (Test-Path -LiteralPath $zipCodex -PathType Leaf)) { throw "ZIP installer did not install its own official Codex CLI" }
          & $zipCodex plugin --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ZIP-installed Codex does not support plugins" }
          $plugins = (& $zipCodex plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          if (-not $installed.enabled -or $installed.marketplaceSource.sourceType -ne "local") { throw "ZIP plugin is not connected locally" }
          if ($installed.version -notlike "*+codex.local.install.*") { throw "ZIP plugin version is not cache-busted: $($installed.version)" }
          $skill = Join-Path $env:CHEONGNYEON_EDITABLE_ROOT "plugins\cheongnyeon-telecom-blog\skills\cheongnyeon-telecom-blog\SKILL.md"
          if (-not (Test-Path -LiteralPath $skill)) { throw "Editable ZIP skill was not copied" }
          $helper = Join-Path $env:CHEONGNYEON_EDITABLE_ROOT "scripts\apply-local-edits-windows.ps1"
          $helperBytes = [IO.File]::ReadAllBytes($helper)
          if ($helperBytes.Length -lt 3 -or $helperBytes[0] -ne 0xEF -or $helperBytes[1] -ne 0xBB -or $helperBytes[2] -ne 0xBF) { throw "ZIP edit helper is missing its UTF-8 BOM" }
          & $helper -CodexPath $zipCodex
          $plugins = (& $zipCodex plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          if (-not $installed.enabled -or $installed.marketplaceSource.sourceType -ne "local" -or $installed.version -notlike "*+codex.local.*") { throw "ZIP edit helper did not apply the local plugin" }
      - name: Verify scheduler and old-to-new auto update
        shell: powershell
        env:
          CODEX_HOME: ${{ runner.temp }}\codex-home
        run: |
          $task = Get-ScheduledTask -TaskName "CheongnyeonTelecomPluginUpdate-CI" -ErrorAction Stop
          if (@($task.Triggers).Count -ne 2) { throw "Expected two automatic update triggers" }
          $bootstrap = Join-Path $env:RUNNER_TEMP "auto-updater\run-update.ps1"
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw "Updater bootstrap was not created" }
          & $env:CODEX_BIN plugin remove cheongnyeon-telecom-blog@cheongnyeon-telecom --json | Out-Null
          & $env:CODEX_BIN plugin marketplace remove cheongnyeon-telecom --json | Out-Null
          & $env:CODEX_BIN plugin marketplace add seojun03/cheongnyeon-telecom-plugins --ref v0.1.0 --json | Out-Null
          & $env:CODEX_BIN plugin add cheongnyeon-telecom-blog@cheongnyeon-telecom --json | Out-Null
          $oldData = (& $env:CODEX_BIN plugin list --json) | ConvertFrom-Json
          $old = $oldData.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          if ($old.version -ne "0.1.0+codex.20260810141037") { throw "Old-version setup failed: $($old.version)" }
          & $bootstrap
          $plugins = (& $env:CODEX_BIN plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          $expected = (Get-Content -LiteralPath "plugins\cheongnyeon-telecom-blog\.codex-plugin\plugin.json" -Raw | ConvertFrom-Json).version
          if (-not $installed.enabled -or $installed.version -ne $expected) { throw "Auto update failed: $($installed.version), expected $expected" }
      - name: Verify Windows HTML output
        shell: powershell
        env:
          CODEX_HOME: ${{ runner.temp }}\codex-home
          CHEONGNYEON_OUTPUT_DIR: ${{ runner.temp }}\naver-output
        run: |
          $plugins = (& $env:CODEX_BIN plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" }
          if (-not $installed.enabled) { throw "Plugin is not enabled" }
          $cache = Join-Path $env:CODEX_HOME "plugins\cache\cheongnyeon-telecom\cheongnyeon-telecom-blog"
          $installedVersion = ((& $env:CODEX_BIN plugin list --json) | ConvertFrom-Json).installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -ExpandProperty version -First 1
          $pluginVersion = Get-ChildItem -Path $cache -Directory | Where-Object { $_.Name -eq $installedVersion } | Select-Object -First 1
          if (-not $pluginVersion) { throw "Installed plugin cache was not found" }
          $article = Join-Path $env:RUNNER_TEMP "article.html"
          '<article><p>Windows 출력 테스트</p></article>' | Set-Content -LiteralPath $article -Encoding utf8
          $builder = Join-Path $pluginVersion.FullName "skills\cheongnyeon-telecom-blog\scripts\build_naver_copy_page.py"
          $output = python $builder --title "Windows 출력 테스트" --article-html $article
          if (-not (Test-Path -LiteralPath $output)) { throw "HTML output was not created" }
          $html = Get-Content -LiteralPath $output -Raw
          if ($html -notmatch "Ctrl\+V") { throw "Windows Ctrl+V guidance was not generated" }
      - name: Remove CI scheduled task
        if: always()
        shell: pwsh
        run: Unregister-ScheduledTask -TaskName "CheongnyeonTelecomPluginUpdate-CI" -Confirm:$false -ErrorAction SilentlyContinue

  install-editable-windows:
    name: Editable one-line install (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the public editable command from a clean state and retry safely
        shell: powershell
        env:
          CODEX_HOME: ${{ runner.temp }}\editable-codex-home
          CODEX_INSTALL_DIR: ${{ runner.temp }}\editable-codex-bin
          CHEONGNYEON_EDITABLE_ROOT: ${{ runner.temp }}\editable-plugin
          CHEONGNYEON_AUTO_UPDATE_TASK_NAME: CheongnyeonTelecomPluginUpdate-Editable-CI
          CHEONGNYEON_SKIP_APP_INSTALL: "1"
          CHEONGNYEON_NO_LAUNCH: "1"
          CHEONGNYEON_SKIP_DESKTOP_SHORTCUT: "1"
          CHEONGNYEON_REPOSITORY_REF: ${{ github.sha }}
        run: |
          $blocked = Join-Path $env:RUNNER_TEMP "editable-access-denied-appx-codex.exe"
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot "System32\whoami.exe") -Destination $blocked
          $originalAcl = Get-Acl -LiteralPath $blocked
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $denyRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $identity,
              [System.Security.AccessControl.FileSystemRights]::ExecuteFile,
              [System.Security.AccessControl.AccessControlType]::Deny
          )
          $blockedAcl = Get-Acl -LiteralPath $blocked
          $blockedAcl.AddAccessRule($denyRule)
          Set-Acl -LiteralPath $blocked -AclObject $blockedAcl
          $env:CHEONGNYEON_CODEX_PATH = $blocked
          try {
              irm "https://raw.githubusercontent.com/seojun03/cheongnyeon-telecom-plugins/${{ github.sha }}/install-editable-windows.ps1" | iex
          } finally {
              Set-Acl -LiteralPath $blocked -AclObject $originalAcl
          }

          $standalone = Join-Path $env:CODEX_INSTALL_DIR "codex.exe"
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) { throw "Official standalone Codex was not installed" }
          & $standalone plugin --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Official standalone Codex does not support plugins" }
          $env:CHEONGNYEON_CODEX_PATH = $standalone

          $plugins = (& $standalone plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          if (-not $installed.enabled -or $installed.marketplaceSource.sourceType -ne "local") { throw "Editable one-line install is not connected locally" }
          if (Get-ScheduledTask -TaskName $env:CHEONGNYEON_AUTO_UPDATE_TASK_NAME -ErrorAction SilentlyContinue) { throw "Editable installer registered an automatic update task" }

          $skill = Join-Path $env:CHEONGNYEON_EDITABLE_ROOT "plugins\cheongnyeon-telecom-blog\skills\cheongnyeon-telecom-blog\SKILL.md"
          Add-Content -LiteralPath $skill -Value "`nEDITABLE_WINDOWS_RETRY_MARKER" -Encoding UTF8
          $helper = Join-Path $env:CHEONGNYEON_EDITABLE_ROOT "scripts\apply-local-edits-windows.ps1"
          Set-Content -LiteralPath $helper -Value "BROKEN_OLD_HELPER" -Encoding ASCII

          irm "https://raw.githubusercontent.com/seojun03/cheongnyeon-telecom-plugins/${{ github.sha }}/install-editable-windows.ps1" | iex

          if ((Get-Content -LiteralPath $skill -Raw -Encoding UTF8) -notmatch "EDITABLE_WINDOWS_RETRY_MARKER") { throw "Editable SKILL.md was overwritten during retry" }
          $refreshedHelper = Get-Content -LiteralPath $helper -Raw -Encoding UTF8
          if ($refreshedHelper -notmatch "function\s+Test-CodexExecutable" -or $refreshedHelper -notmatch "function\s+Invoke-Codex") { throw "Retry did not repair the local edit helper" }

          & $helper -CodexPath $standalone
          $plugins = (& $standalone plugin list --json) | ConvertFrom-Json
          $installed = $plugins.installed | Where-Object { $_.pluginId -eq "cheongnyeon-telecom-blog@cheongnyeon-telecom" } | Select-Object -First 1
          if (-not $installed.enabled -or $installed.marketplaceSource.sourceType -ne "local" -or $installed.version -notlike "*+codex.local.*") { throw "Repaired local helper did not apply the editable plugin" }
          $cacheSkill = Join-Path $env:CODEX_HOME "plugins\cache\cheongnyeon-telecom\cheongnyeon-telecom-blog\$($installed.version)\skills\cheongnyeon-telecom-blog\SKILL.md"
          if ((Get-Content -LiteralPath $cacheSkill -Raw -Encoding UTF8) -notmatch "EDITABLE_WINDOWS_RETRY_MARKER") { throw "Local edit marker was not copied to the active plugin cache" }
      - name: Remove editable CI scheduled task
        if: always()
        shell: powershell
        run: Unregister-ScheduledTask -TaskName "CheongnyeonTelecomPluginUpdate-Editable-CI" -Confirm:$false -ErrorAction SilentlyContinue

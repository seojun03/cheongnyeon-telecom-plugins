interface:
  display_name: "청년통신 블로그"
  short_description: "외부 제목 아이디어와 청년통신 마스터를 분리해 HTML 작성"
  default_prompt: "$cheongnyeon-telecom-blog를 모든 모델과 추론 수준에서 실행하세요. 현재 모델이 GPT-5.6 Sol High 이상이 아닌 것으로 명확히 확인될 때만 '참고: 글 퀄리티를 위해 GPT-5.6 Sol High 이상 모델을 사용해주시면 좋습니다. 현재 모델에서도 작업은 계속 진행합니다.'를 응답 상단에 한 번 안내하고 중단 없이 계속하세요. 모델 정보를 확인할 수 없으면 낮다고 추측하거나 확인을 요구하지 말고 경고 없이 진행하세요. 자동모드로 검증된 청년통신 사실과 주 마스터 한 편을 사용해 HTML 요청 여부와 관계없이 현재 사용자의 바탕화면에 네이버용 HTML을 완성하세요. 이미지는 로컬 파일을 요구하지 말고 선택 마스터의 레퍼런스 블로그 원본 URL을 같은 위치와 순서로 사용하며 두 참고 글 링크를 역할별로 알려 주세요."

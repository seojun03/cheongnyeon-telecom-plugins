interface:
  display_name: "청년통신 블로그"
  short_description: "외부 제목 아이디어와 청년통신 마스터를 분리해 HTML 작성"
  default_prompt: "$cheongnyeon-telecom-blog를 자동모드로 모든 모델과 추론 수준에서 실행하세요. 메인키워드가 없으면 첫 응답은 '메인키워드를 입력해 주세요.' 한 문장만 출력하고, 키워드를 받으면 다른 사전 질문 없이 검증된 청년통신 사실과 주 마스터 한 편으로 제목·본문·꾸미기·네이버용 HTML까지 HTML 요청 여부와 관계없이 완성하고 두 참고 글 링크를 역할별로 알려 주세요. 현재 모델이 GPT-5.6 Sol High 이상이 아닌 것으로 명확히 확인될 때만 키워드를 받은 다음 작업 응답 상단에 '참고: 글 퀄리티를 위해 GPT-5.6 Sol High 이상 모델을 사용해주시면 좋습니다. 현재 모델에서도 작업은 계속 진행합니다.'를 한 번 표시하고 중단 없이 계속하세요."
